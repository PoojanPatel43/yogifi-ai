# Application
spring.application.name=yogifi-api
server.port=8080

# Active Profile (default is 'dev')
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# PostgreSQL Configuration (for production)
# Uncomment and configure for production
# spring.datasource.url=jdbc:postgresql://localhost:5432/yogifi_db
# spring.datasource.username=postgres
# spring.datasource.password=${DB_PASSWORD}
# spring.datasource.driver-class-name=org.postgresql.Driver

# H2 Database (for development)
spring.datasource.url=jdbc:h2:mem:yogifi_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# For PostgreSQL:
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
# REQUIRED: Set JWT_SECRET env var. Generate with: openssl rand -base64 64
# No fallback — app will refuse to start if this is missing or too short.
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# AI API Configuration (Gemini or Anthropic)
# Provider: gemini or anthropic
ai.api.provider=${AI_PROVIDER:gemini}
ai.api.key=${AI_API_KEY:}

# Gemini Configuration (default)
ai.api.url=${AI_API_URL:https://generativelanguage.googleapis.com/v1/models/gemini-2.0-flash-001:generateContent}
ai.api.model=${AI_MODEL:gemini-2.0-flash-001}
ai.api.max-tokens=${AI_MAX_TOKENS:8192}

# Anthropic Configuration (alternative)
# ai.api.url=https://api.anthropic.com/v1/messages
# ai.api.model=claude-sonnet-3-5-20241022

# Pose Detection Microservice (Python FastAPI — pose-service/main.py)
pose.service.url=${POSE_SERVICE_URL:http://localhost:8001}

# Langfuse Observability (LLM tracing — https://cloud.langfuse.com)
# Set LANGFUSE_PUBLIC_KEY and LANGFUSE_SECRET_KEY env vars to enable.
# Leave blank in dev to disable tracing silently (no error thrown).
langfuse.public-key=${LANGFUSE_PUBLIC_KEY:}
langfuse.secret-key=${LANGFUSE_SECRET_KEY:}
langfuse.host=${LANGFUSE_HOST:https://cloud.langfuse.com}

# Logging
logging.level.com.yogifi=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Server Settings — never expose internals; prod profile enforces never
server.error.include-message=on_param
server.error.include-binding-errors=on_param
